[project]
name = "lib-finder"
version = "0.1.0"
description = "Tools for collecting and caching package metadata from PyPI"
readme = "README.md"
authors = [
    { name = "geehexx", email = "221785262+geehexx@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "ijson>=3.5.0",
    "packaging>=26.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tqdm>=4.68.0",
    "typer>=0.26.7",
]

[project.scripts]
lib-finder = "lib_finder:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "hypothesis>=6.0.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.0",
    "respx>=0.23.1",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "live: tests that require live network access to external services",
    "recorded: tests that replay recorded HTTP interactions",
    "smoke: fast end-to-end smoke tests",
    "property: property-based tests",
    "slow: slower tests",
    "vcr: VCR-recorded HTTP tests",
]
